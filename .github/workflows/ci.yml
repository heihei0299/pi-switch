name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify / go and webui
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build:webui

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./...
        env:
          PI_SWITCH_DB: ${{ runner.temp }}/pi-switch-requests.db

      - name: Typecheck WebUI
        run: npm --prefix webui run typecheck

      - name: Test WebUI
        run: npm run test:webui

      - name: Install Playwright Chromium
        run: cd webui && npx playwright install --with-deps chromium

      - name: Test WebUI responsive baseline
        run: npm --prefix webui run test:e2e

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Build Go (current platform)
        run: npm run build:go

      - name: Verify build identity
        run: |
          info=$(bin/pi-switch --build-info)
          expected=$(git rev-parse --short=7 HEAD)
          node -e 'const info=JSON.parse(process.argv[1]); const target=process.argv[2]; const expected=process.argv[3]; if (info.commit !== expected || info.buildTime === "unknown" || info.target !== target || !["true","false"].includes(info.dirty)) { console.error({info, expected, target}); process.exit(1); }' "$info" "$(go env GOOS)/$(go env GOARCH)" "$expected"
          bin/pi-switch --help >/dev/null

      - name: Deterministic functional smoke
        run: bash scripts/functional-check.sh bin/pi-switch

  release-preflight:
    needs: [verify, build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    name: release preflight / tag and npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          package_name=$(node -p "require('./package.json').name")
          test "$RELEASE_TAG" = "v$version"
          if npm view "$package_name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm"
            exit 1
          fi
          echo "preflight accepted $RELEASE_TAG for $package_name@$version"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
          - goos: windows
            goarch: amd64
            os: windows-latest
          - goos: windows
            goarch: arm64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.goos }}-${{ matrix.goarch }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build:webui

      - name: Build Go binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then ext=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} bash scripts/build-go.sh "bin/pi-switch-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          ls -lh "bin/pi-switch-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "bin/pi-switch-*"
          if-no-files-found: error

  publish:
    needs: [build, verify, release-preflight]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build:webui

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
          if-no-files-found: error

      - name: Move artifacts to bin
        run: |
          mkdir -p bin
          mv artifacts/pi-switch-* bin/ 2>/dev/null || mv artifacts/* bin/ 2>/dev/null || true
          ls -lh bin/

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --json > npm-pack.json
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("npm-pack.json", "utf8"));
          const files = report.flatMap((entry) => entry.files || []).map((entry) => entry.path);
          const required = [
            "package.json",
            "bin/pi-switch.js",
            "bin/pi-switch-linux-amd64",
            "bin/pi-switch-linux-arm64",
            "bin/pi-switch-darwin-amd64",
            "bin/pi-switch-darwin-arm64",
            "bin/pi-switch-windows-amd64.exe",
            "bin/pi-switch-windows-arm64.exe",
          ];
          const missing = required.filter((file) => !files.includes(file));
          const forbidden = files.filter((file) => /(^|\/)(\.env|.*\.key$|.*secret.*|node_modules|\.git)(\/|$)/i.test(file));
          if (missing.length || forbidden.length) {
            console.error({ missing, forbidden });
            process.exit(1);
          }
          console.log(`validated ${files.length} npm package files`);
          NODE

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish
        run: |
          ver=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          for i in 1 2 3 4 5 6; do
            if npm view "$pkg@$ver" version 2>/dev/null | grep -q "$ver"; then
              echo "verified $pkg@$ver on registry"
              curl -fsSL "https://registry.npmjs.org/$pkg/$ver" | head -c 500
              exit 0
            fi
            echo "retry $i/6 for $pkg@$ver"
            sleep 5
          done
          echo "publish verification failed for $pkg@$ver"
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Create issue on publish verification failure
        if: failure()
        run: |
          gh issue create --title "chore(release): ${{ github.ref_name }} 发布后自检失败" --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
