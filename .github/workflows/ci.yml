name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify / rust and webui
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build:webui

      - name: Find changed Rust files
        id: rust-files
        shell: bash
        run: |
          # tag 事件下 origin/main...HEAD 为空，改用 HEAD~1...HEAD 兜底；非 tag 直接全量检查
          if git rev-parse origin/main >/dev/null 2>&1; then
            base="origin/main...HEAD"
            if ! git diff --name-only $base -- '*.rs' > changed-rust-files.txt 2>/dev/null || ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              : > changed-rust-files.txt
            fi
          else
            git diff --name-only HEAD~1...HEAD -- '*.rs' > changed-rust-files.txt 2>/dev/null || : > changed-rust-files.txt
          fi
          # tag 推送时 changed 文件为空则回退为全量校验（避免误跳过）
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            : > changed-rust-files.txt
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          elif [[ -s changed-rust-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed Rust files for manual runs
        if: github.event_name == 'workflow_dispatch' && steps.rust-files.outputs.has_files == 'true'
        shell: bash
        run: |
          xargs -r rustfmt --edition 2021 --config skip_children=true < changed-rust-files.txt
          git diff --binary > rustfmt.patch

      - name: Upload Rust formatting patch
        if: github.event_name == 'workflow_dispatch' && steps.rust-files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

      - name: Check Rust formatting (full when tag or no changed files)
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ steps.rust-files.outputs.has_files }}" == "false" ]]; then
            cargo fmt --check
          else
            xargs -r rustfmt --edition 2021 --config skip_children=true --check < changed-rust-files.txt
          fi

      - name: Lint Rust
        run: >-
          cargo clippy --all-targets --
          -D warnings
          -A clippy::manual_checked_ops
          -A clippy::manual_is_multiple_of
          -A clippy::collapsible_match
          -A clippy::unnecessary_sort_by

      # TODO(ci-guard): 恢复 config.rs config_dir/pi_dir 测试隔离后去掉 --test-threads=1（当前 config.rs 未隔离，proxy.rs 已隔离，见 .scratch/research/ci-actions-调研.md）
      - name: Test Rust
        run: cargo test --release --lib -- --test-threads=1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_zig: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install zig (for glibc 2.31 targeting)
        if: matrix.use_zig == true
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Install cargo-zigbuild
        if: matrix.use_zig == true
        run: pip3 install cargo-zigbuild

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build:webui

      - name: Build native (with zig for glibc 2.31)
        if: matrix.use_zig == true
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
          cp target/x86_64-unknown-linux-gnu/release/libpi_switch_native.so pi-switch-native.linux-x64-gnu.node

      - name: Build native (standard)
        if: matrix.use_zig != true
        run: |
          npm install -g @napi-rs/cli
          npm run build:native -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
          if-no-files-found: error

      - name: Move artifacts to project root
        run: mv artifacts/*.node .

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish
        run: |
          ver=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          for i in 1 2 3 4 5 6; do
            if npm view "$pkg@$ver" version 2>/dev/null | grep -q "$ver"; then
              echo "verified $pkg@$ver on registry"
              curl -fsSL "https://registry.npmjs.org/$pkg/$ver" | head -c 500
              exit 0
            fi
            echo "retry $i/6 for $pkg@$ver"
            sleep 5
          done
          echo "publish verification failed for $pkg@$ver"
          exit 1

      - name: Create issue on publish verification failure
        if: failure()
        run: |
          gh issue create --title "chore(release): ${{ github.ref_name }} 发布后自检失败" --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
