name: Desktop CI (test artifacts only)

on:
  push:
    branches: [mygo]
  pull_request:
    branches: [mygo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify desktop module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install WebUI dependencies
        run: npm ci --prefix webui

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build WebUI for Go embed
        run: npm --prefix webui run build

      - name: Test and vet desktop module
        working-directory: desktop
        run: |
          CGO_ENABLED=0 go test -mod=readonly ./...
          CGO_ENABLED=0 go vet -mod=readonly ./...
          ./node_modules/.bin/mygo vet .

      - name: Test shared daemon service
        run: go test ./internal/daemon

      - name: Scan tracked source for secrets
        run: bash scripts/check-secrets.sh

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux/amd64
            cli: pi-switch
            needs_nsis: false
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            platform: linux/arm64
            cli: pi-switch
            needs_nsis: false
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            platform: windows/amd64
            cli: pi-switch.exe
            needs_nsis: true
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            platform: windows/arm64
            cli: pi-switch.exe
            needs_nsis: true
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin/amd64
            cli: pi-switch
            needs_nsis: false
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin/arm64
            cli: pi-switch
            needs_nsis: false

    runs-on: ${{ matrix.os }}
    name: package test / ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install NSIS for Windows installer
        if: matrix.needs_nsis
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Install WebUI dependencies
        run: npm ci --prefix webui

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build embedded frontends
        working-directory: desktop
        run: npm --prefix ../webui run build && bun run build:web

      - name: Build matching CLI resource
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bash scripts/build-go.sh "desktop/resources/${{ matrix.cli }}"

      - name: Verify bundled CLI commit and target identity
        shell: bash
        env:
          CLI_RESOURCE: desktop/resources/${{ matrix.cli }}
          EXPECTED_TARGET: ${{ matrix.platform }}
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          strings "$CLI_RESOURCE" | grep -Fx "$commit" >/dev/null
          strings "$CLI_RESOURCE" | grep -Fx "$EXPECTED_TARGET" >/dev/null

      - name: Record test build identity
        env:
          DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: |
          printf '{"commit":"%s","platform":"%s","distribution":"internal-test-only","releaseSigning":"not-configured","notarized":false}\n' \
            "$GITHUB_SHA" "$DESKTOP_PLATFORM" > desktop/resources/build-identity.json

      - name: Build desktop installer/package
        working-directory: desktop
        run: ./node_modules/.bin/mygo build -platform "${{ matrix.platform }}" -skip-build-command -skip-notarize

      - name: Smoke-test Linux installer in an isolated HOME
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: desktop
        run: |
          installer=$(find build/linux-amd64 -maxdepth 1 -name install.sh -print -quit)
          archive=$(find build/linux-amd64 -maxdepth 1 -name 'pi-switch-mygo-spike-*-linux-amd64.tar.gz' -print -quit)
          test -n "$installer" && test -n "$archive"
          bash scripts/test-linux-installer.sh "$installer" "$archive"

      - name: Reject credential-shaped package files
        shell: bash
        run: |
          if find desktop/build -type f \( -name '.env' -o -iname '*secret*' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \) -print -quit | grep -q .; then
            echo "credential-shaped file found in desktop package output"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-test-${{ matrix.goos }}-${{ matrix.goarch }}
          path: desktop/build/**
          if-no-files-found: error
          retention-days: 7
