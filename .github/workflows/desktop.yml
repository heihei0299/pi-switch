name: Desktop CI (test artifacts only)

on:
  push:
    branches: [mygo]
  pull_request:
    branches: [mygo, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify desktop module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            go.sum

      - name: Install WebUI dependencies
        run: npm ci --prefix webui

      - name: Build WebUI for Go embed
        run: npm --prefix webui run build

      - name: Test and vet desktop module
        working-directory: desktop
        run: |
          CGO_ENABLED=0 go test -mod=readonly ./...
          CGO_ENABLED=0 go vet -mod=readonly ./...
          go run -mod=readonly github.com/egoist/mygo/cmd/mygo vet .

      - name: Test shared daemon service
        run: go test ./internal/daemon

      - name: Scan tracked source for secrets
        run: bash scripts/check-secrets.sh

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: package test / linux-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            go.sum

      - name: Install WebUI dependencies
        run: npm ci --prefix webui

      - name: Build WebUI for the retained Go embed
        run: npm --prefix webui run build

      - name: Build matching CLI resource
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: bash scripts/build-go.sh desktop/resources/pi-switch

      - name: Verify bundled CLI commit and target identity
        shell: bash
        env:
          CLI_RESOURCE: desktop/resources/pi-switch
          EXPECTED_TARGET: linux/${{ matrix.goarch }}
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          strings "$CLI_RESOURCE" | grep -Fx "$commit" >/dev/null
          strings "$CLI_RESOURCE" | grep -Fx "$EXPECTED_TARGET" >/dev/null

      - name: Record test build identity
        env:
          DESKTOP_PLATFORM: linux/${{ matrix.goarch }}
        run: |
          printf '{"commit":"%s","platform":"%s","distribution":"internal-test-only","releaseSigning":"not-configured","notarized":false}\n' \
            "$GITHUB_SHA" "$DESKTOP_PLATFORM" > desktop/resources/build-identity.json

      - name: Build desktop installer/package
        working-directory: desktop
        run: go run -mod=readonly github.com/egoist/mygo/cmd/mygo build -platform "linux/${{ matrix.goarch }}" -skip-build-command -skip-notarize

      - name: Build previous-source desktop package for rollback smoke
        if: github.event_name == 'push'
        env:
          DESKTOP_ARCH: ${{ matrix.goarch }}
        run: |
          source_commit=$(git log -1 --format=%H "$GITHUB_SHA" -- ':(glob)desktop/*.go' ':(exclude,glob)desktop/*_test.go')
          test -n "$source_commit"
          rollback_sha=$(git rev-parse "${source_commit}^")
          if git diff --quiet "$rollback_sha" "$GITHUB_SHA" -- ':(glob)desktop/*.go' ':(exclude,glob)desktop/*_test.go'; then
            echo "rollback baseline has no production Desktop Go source delta" >&2
            exit 1
          fi
          echo "Building rollback baseline $rollback_sha (parent of latest production Desktop Go source commit $source_commit)"
          echo "ROLLBACK_SHA=$rollback_sha" >> "$GITHUB_ENV"
          previous="$RUNNER_TEMP/pi-switch-previous"
          git worktree add --detach "$previous" "$rollback_sha"
          npm ci --prefix "$previous/webui"
          npm --prefix "$previous/webui" run build
          (
            cd "$previous"
            GOOS=linux GOARCH="$DESKTOP_ARCH" bash scripts/build-go.sh desktop/resources/pi-switch
            printf '{"commit":"%s","platform":"linux/%s","distribution":"internal-test-only","releaseSigning":"not-configured","notarized":false}\n' \
              "$rollback_sha" "$DESKTOP_ARCH" > desktop/resources/build-identity.json
            cd desktop
            go run -mod=readonly github.com/egoist/mygo/cmd/mygo build -platform "linux/$DESKTOP_ARCH" -skip-build-command -skip-notarize
          )

      - name: Test Debian package lifecycle and rollback Xvfb smoke (not GUI gate)
        env:
          DESKTOP_ARCH: ${{ matrix.goarch }}
          ROLLBACK_NATIVE_WINDOW_SMOKE: ${{ matrix.goarch == 'arm64' && github.event_name == 'push' }}
        run: |
          deb=$(find "desktop/build/linux-${DESKTOP_ARCH}" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          args=("$deb")
          if [[ "$GITHUB_EVENT_NAME" == push && -n "${ROLLBACK_SHA:-}" ]]; then
            previous_deb=$(find "$RUNNER_TEMP/pi-switch-previous/desktop/build/linux-${DESKTOP_ARCH}" -maxdepth 1 -name '*.deb' -print -quit)
            test -n "$previous_deb"
            args+=("$previous_deb")
          fi
          bash desktop/scripts/test-deb-package-lifecycle.sh "${args[@]}"

      - name: Smoke-test packaged arm64 Native window under Xvfb (not GUI gate)
        if: matrix.goarch == 'arm64'
        env:
          DESKTOP_ARCH: ${{ matrix.goarch }}
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
          deb=$(find "desktop/build/linux-${DESKTOP_ARCH}" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          sudo apt-get install -y --no-install-recommends "./$deb"
          bash desktop/scripts/test-native-window-xvfb.sh \
            /opt/pi-switch-mygo-spike/pi-switch-mygo-spike \
            "$RUNNER_TEMP/pi-switch-native-window.log"
          sudo apt-get purge -y pi-switch-mygo-spike
          test ! -e /opt/pi-switch-mygo-spike/pi-switch-mygo-spike

      - name: Run bundled CLI on native arm64
        if: matrix.goarch == 'arm64'
        env:
          EXPECTED_TARGET: linux/arm64
        run: |
          test "$(uname -m)" = aarch64
          binary=desktop/build/linux-arm64/pi-switch
          "$binary" --version >/dev/null
          info=$("$binary" --build-info)
          expected_commit=$(git rev-parse --short=7 HEAD)
          node - "$info" "$expected_commit" <<'NODE'
          const [raw, commit] = process.argv.slice(2);
          const info = JSON.parse(raw);
          if (info.target !== process.env.EXPECTED_TARGET || info.commit !== commit) {
            console.error({ target: info.target, commit: info.commit });
            process.exit(1);
          }
          NODE

      - name: Smoke-test bundled CLI management API and headless Proxy
        env:
          DESKTOP_ARCH: ${{ matrix.goarch }}
        run: bash scripts/functional-check.sh "desktop/build/linux-${DESKTOP_ARCH}/pi-switch"

      - name: Smoke-test Linux installer archive in an isolated HOME
        working-directory: desktop
        run: |
          package_dir="build/linux-${{ matrix.goarch }}"
          installer=$(find "$package_dir" -maxdepth 1 -name install.sh -print -quit)
          archive=$(find "$package_dir" -maxdepth 1 -name "pi-switch-mygo-spike-*-linux-${{ matrix.goarch }}.tar.gz" -print -quit)
          test -n "$installer" && test -n "$archive"
          bash scripts/test-linux-installer.sh "$installer" "$archive"

      - name: Reject credential-shaped package files
        shell: bash
        run: |
          if find desktop/build -type f \( -name '.env' -o -iname '*secret*' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \) -print -quit | grep -q .; then
            echo "credential-shaped file found in desktop package output"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-test-linux-${{ matrix.goarch }}
          path: desktop/build/**
          if-no-files-found: error
          retention-days: 7
